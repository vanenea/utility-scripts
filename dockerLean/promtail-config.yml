server:
  http_listen_port: 3004

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3003/loki/api/v1/push

scrape_configs:
  - job_name: varlogs
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log
