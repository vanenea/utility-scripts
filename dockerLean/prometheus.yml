global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["host.docker.internal:3001"]

#  - job_name: "node_exporter"
#    static_configs:
#      - targets: ["your_server_ip:9100"]

  - job_name: "springboot_app"
    metrics_path: "/actuator/prometheus"
    scheme: http
    static_configs:
      - targets:
          - "host.docker.internal:3000"
